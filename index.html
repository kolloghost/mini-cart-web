<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A mini shopping cart built with vanilla JavaScript."
    />
    <title>M-S Mini Shop</title>
  </head>

  <body class="min-h-screen bg-slate-100 text-slate-900">
    <header class="bg-slate-900 text-white">
      <div
        class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-6"
      >
        <div>
          <p class="text-xs uppercase tracking-widest text-indigo-300">
            Everyday essentials
          </p>
          <h1 class="mt-1 text-2xl font-bold">M-S Mini Shop</h1>
        </div>

        <a
          href="#cart"
          class="shrink-0 rounded-xl bg-slate-800 px-4 py-3 text-sm"
        >
          Cart (<span id="cart-count">0</span>)
        </a>
      </div>
    </header>

    <main
      class="mx-auto grid max-w-6xl gap-8 px-4 py-8 lg:grid-cols-3"
    >
      <section class="min-w-0 lg:col-span-2" aria-labelledby="products-heading">
        <h2 id="products-heading" class="text-2xl font-bold">
          Shop our products
        </h2>
        <p class="mt-2 text-slate-600">
          Pick something you like and add it to your cart.
        </p>

        <div
          id="product-list"
          class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2"
        ></div>
      </section>

      <aside
        id="cart"
        class="min-w-0 self-start rounded-2xl bg-white p-5 shadow-sm lg:sticky lg:top-6"
        aria-labelledby="cart-heading"
      >
        <h2 id="cart-heading" class="text-xl font-bold">Your cart</h2>

        <ul id="cart-items" class="mt-5 space-y-4"></ul>

        <div class="mt-6 border-t border-slate-200 pt-5">
          <div class="flex items-center justify-between gap-3">
            <span class="font-medium">Total</span>
            <span id="cart-total" class="text-xl font-bold">₦0</span>
          </div>

          <p class="mt-3 text-sm text-slate-500">
            Practice shop — no payment will be collected.
          </p>
        </div>
      </aside>
    </main>

    <p id="cart-status" class="sr-only" role="status"></p>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
